name: GuJi Docker Image

on:
  push:
    branches:
      - guji
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: guji-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/guji08233/astrbot

jobs:
  build-and-push:
    if: github.repository == 'GuJi08233/AstrBot'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.13.0"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Build Dashboard
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Add Dashboard to Docker build context
        shell: bash
        run: |
          dashboard_version=$(python3 - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as file:
              print("v" + tomllib.load(file)["project"]["version"])
          PY
          )

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$dashboard_version" ]]; then
              echo "Git tag $GITHUB_REF_NAME does not match project version $dashboard_version." >&2
              exit 1
            fi
          fi

          mkdir -p dashboard/dist/assets astrbot/dashboard
          printf '%s\n' "$dashboard_version" > dashboard/dist/assets/version
          rm -rf astrbot/dashboard/dist
          cp -a dashboard/dist astrbot/dashboard/dist

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: image-tags
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "${IMAGE_NAME}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF_NAME" != *"alpha"* && "$GITHUB_REF_NAME" != *"beta"* && "$GITHUB_REF_NAME" != *"rc"* ]]; then
              echo "${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "${IMAGE_NAME}:guji-latest" >> "$GITHUB_OUTPUT"
            echo "${IMAGE_NAME}:guji-${short_sha}" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/GuJi08233/AstrBot
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
